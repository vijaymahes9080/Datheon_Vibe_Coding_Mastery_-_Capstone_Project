      <text x="24" y="196" font-family="system-ui, sans-serif" font-size="11" fill="#047857">• OWASP ASVS Verified</text>
      <text x="24" y="218" font-family="system-ui, sans-serif" font-size="11" fill="#047857">• Zero credential leaks</text>
